name: Check Sony Store Stock

on:
  schedule:
    - cron: '*/5 * * * *'  # รันอัตโนมัติทุกๆ 5 นาที
  workflow_dispatch:       # เพิ่มปุ่มให้กดสั่งรันทดสอบเองได้

permissions:
  contents: write

jobs:
  check-stock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run stock checker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python check_sony.py --once

      - name: Save stock state
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add stock_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update stock state" && git push)
